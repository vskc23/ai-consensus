<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#f8fafc"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">AI Consensus Chat — one turn</text>
  <text x="30" y="58" font-size="13" fill="#475569">question → focused searches → four models cite shared evidence → a rubric judge synthesizes the winner</text>

  <!-- ROW 1: pipeline -->
  <rect x="30" y="80" width="150" height="58" rx="8" fill="#334155"/>
  <text x="105" y="105" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Your question</text>
  <text x="105" y="123" font-size="10" fill="#cbd5e1" text-anchor="middle">multi-part allowed</text>

  <rect x="225" y="80" width="180" height="58" rx="8" fill="#334155"/>
  <text x="315" y="105" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">split_questions()</text>
  <text x="315" y="123" font-size="10" fill="#cbd5e1" text-anchor="middle">&gt; up to 3 focused sub-queries</text>

  <rect x="450" y="80" width="210" height="58" rx="8" fill="#334155"/>
  <text x="555" y="105" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Tavily /search</text>
  <text x="555" y="123" font-size="10" fill="#cbd5e1" text-anchor="middle">general topic · merged · deduped</text>

  <rect x="705" y="80" width="245" height="58" rx="8" fill="#0f766e"/>
  <text x="827" y="105" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Evidence [S1]…[S6] + date stamp</text>
  <text x="827" y="123" font-size="10" fill="#a7f3d0" text-anchor="middle">published dates kept · "today" injected</text>

  <line x1="180" y1="109" x2="221" y2="109" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="405" y1="109" x2="446" y2="109" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="109" x2="701" y2="109" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- evidence fan-out -->
  <line x1="827" y1="138" x2="827" y2="186" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="135" y1="198" x2="825" y2="198" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="252" y="192" font-size="10" font-style="italic" fill="#475569">the same evidence block to every model</text>
  <line x1="135" y1="198" x2="135" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="365" y1="198" x2="365" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="595" y1="198" x2="595" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="198" x2="825" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ROW 2: models -->
  <rect x="30" y="230" width="210" height="64" rx="8" fill="#475569"/>
  <text x="135" y="257" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">OpenAI</text>
  <text x="135" y="275" font-size="10" fill="#cbd5e1" text-anchor="middle">cites [S#]</text>

  <rect x="260" y="230" width="210" height="64" rx="8" fill="#475569"/>
  <text x="365" y="257" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">Claude</text>
  <text x="365" y="275" font-size="10" fill="#cbd5e1" text-anchor="middle">cites [S#]</text>

  <rect x="490" y="230" width="210" height="64" rx="8" fill="#475569"/>
  <text x="595" y="257" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">Gemini</text>
  <text x="595" y="275" font-size="10" fill="#cbd5e1" text-anchor="middle">cites [S#]</text>

  <rect x="720" y="230" width="210" height="64" rx="8" fill="#475569"/>
  <text x="825" y="257" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">DeepSeek</text>
  <text x="825" y="275" font-size="10" fill="#cbd5e1" text-anchor="middle">cites [S#]</text>

  <!-- answers converge on the judge -->
  <line x1="135" y1="294" x2="135" y2="406" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="365" y1="294" x2="365" y2="406" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="595" y1="294" x2="595" y2="406" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="825" y1="294" x2="825" y2="406" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="135" y1="406" x2="825" y2="406" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="490" y1="406" x2="490" y2="426" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="400" font-size="10" font-style="italic" fill="#475569">four answers, each with [S#]</text>

  <!-- ROW 3: judge -->
  <rect x="340" y="430" width="300" height="80" rx="8" fill="#0f766e"/>
  <text x="490" y="456" font-size="13" font-weight="700" fill="#ecfdf5" text-anchor="middle">Judge — rubric</text>
  <text x="490" y="474" font-size="10" fill="#a7f3d0" text-anchor="middle">accuracy·grounding·completeness·reasoning·relevance·clarity</text>
  <text x="490" y="491" font-size="10" fill="#a7f3d0" text-anchor="middle">weighted · date integrity · unsupported-precision caps</text>

  <!-- ROW 4: output -->
  <line x1="490" y1="510" x2="490" y2="541" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="340" y="545" width="300" height="62" rx="8" fill="#0d9488"/>
  <text x="490" y="569" font-size="13" font-weight="700" fill="#ecfdf5" text-anchor="middle">Final answer + [S#] citations</text>
  <text x="490" y="587" font-size="10" fill="#a7f3d0" text-anchor="middle">resolves contradictions · states what is unknown</text>

  <line x1="640" y1="576" x2="716" y2="576" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="720" y="545" width="230" height="62" rx="8" fill="#334155"/>
  <text x="835" y="569" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">results/*.json · logs/*.json</text>
  <text x="835" y="587" font-size="10" fill="#cbd5e1" text-anchor="middle">one file per turn · chmod 600 · gitignored</text>

  <text x="30" y="632" font-size="10" fill="#64748b">Secrets live in ~/.config/ai_consensus/.env · non-secret config in config.json · /sources prints the [S#] → URL map</text>
</svg>
